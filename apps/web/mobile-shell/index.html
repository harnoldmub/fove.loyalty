<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>FOVE</title>
  <meta name="theme-color" content="#14204A" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0d1430;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    .container {
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .logo-badge {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2c55f5 0%, #14204a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(44, 85, 245, 0.35);
      position: relative;
    }
    .logo-badge svg {
      width: 44px;
      height: 44px;
      color: #ffffff;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #2c55f5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .offline-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 16px;
      width: 100%;
    }
    .btn-retry {
      background: #2c55f5;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-retry:active {
      background: #1e3ec4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <!-- FOVE sync icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
        <path d="M16 21h5v-5" />
      </svg>
    </div>

    <div>
      <h1 class="brand-title">FOVE</h1>
      <p class="brand-subtitle">Programme de fidélité & encaissement</p>
    </div>

    <div id="loader" class="spinner"></div>

    <div id="offline-box" class="offline-box">
      <p style="font-size: 14px; color: #cbd5e1;">Connexion internet introuvable. Veuillez vérifier votre réseau.</p>
      <button class="btn-retry" onclick="checkAndConnect()">Réessayer</button>
    </div>
  </div>

  <script>
    const TARGET_URL = window.FOVE_REMOTE_URL || "https://app.fove.digital";

    function checkAndConnect() {
      const loader = document.getElementById("loader");
      const offlineBox = document.getElementById("offline-box");
      loader.style.display = "block";
      offlineBox.style.display = "none";

      if (navigator.onLine) {
        window.location.replace(TARGET_URL);
      } else {
        setTimeout(() => {
          loader.style.display = "none";
          offlineBox.style.display = "flex";
        }, 800);
      }
    }

    window.addEventListener("online", checkAndConnect);
    // Initial check
    setTimeout(checkAndConnect, 500);
  </script>
</body>
</html>
