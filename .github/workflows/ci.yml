name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fove
          POSTGRES_PASSWORD: fove
          POSTGRES_DB: fove_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fove" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fove:fove@localhost:5432/fove_test
      DIRECT_DATABASE_URL: postgresql://fove:fove@localhost:5432/fove_test
      TEST_DATABASE_URL: postgresql://fove:fove@localhost:5432/fove_test
      APP_ENCRYPTION_KEY: ${{ secrets.CI_APP_ENCRYPTION_KEY || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}
      CRON_SECRET: ci-cron-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @fove/web lint
      - run: pnpm test
