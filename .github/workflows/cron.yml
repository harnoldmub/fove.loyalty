name: Tâches planifiées

# Remplace un worker permanent : relance des webhooks en échec, expiration des
# points, nettoyage des sessions. GitHub Actions planifie au mieux toutes les
# 5 minutes ; un léger retard est sans conséquence.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher les tâches FOVE
        env:
          API_URL: ${{ vars.FOVE_API_URL }}
          CRON_SECRET: ${{ secrets.FOVE_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "FOVE_API_URL ou FOVE_CRON_SECRET non configuré : rien à faire."; exit 0; fi
          curl --fail --silent --show-error -X POST "$API_URL/api/jobs/run" -H "x-cron-secret: $CRON_SECRET"
